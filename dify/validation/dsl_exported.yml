    - data:
        code: "import json\n\ndef main(llm_text: str = \"\", player_id: str = \"\"\
          , player_input: str = \"\", action: str = \"\") -> dict:\n    raw = str(llm_text\
          \ or \"\").strip()\n    text = raw\n    if text.startswith(\"```\"):\n \
          \       parts = text.split(\"```\")\n        text = parts[1] if len(parts)\
          \ > 1 else text\n        if text.lstrip().lower().startswith(\"json\"):\n\
          \            text = text.lstrip()[4:]\n    data = None\n    try:\n     \
          \   data = json.loads(text)\n    except Exception:\n        start = text.find(\"\
          {\")\n        end = text.rfind(\"}\")\n        if start != -1 and end >\
          \ start:\n            try:\n                data = json.loads(text[start:end\
          \ + 1])\n            except Exception:\n                data = None\n  \
          \  note = \"parsed\"\n    if not isinstance(data, dict):\n        data =\
          \ {}\n        note = \"fallback\"\n    reply = str(data.get(\"reply\") or\
          \ \"\").strip()\n    if not reply:\n        reply = raw if raw else \"……夜班的灯管闪了一下，阿澈什么也没说。\"\
          \n        note = \"fallback\"\n    choices = data.get(\"choices\")\n   \
          \ if not isinstance(choices, list):\n        choices = []\n    choices =\
          \ [str(choice).strip() for choice in choices if str(choice).strip()][:4]\n\
          \    chapter = str(data.get(\"chapter\") or \"\").strip()[:64]\n    try:\n\
          \        bond = int(data.get(\"bond_delta\") or 0)\n    except Exception:\n\
          \        bond = 0\n    if bond > 3:\n        bond = 3\n    if bond < -3:\n\
