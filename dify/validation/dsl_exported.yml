    - data:
        code: "import json\n\ndef main(state_json: str = \"\", player_id: str = \"\
          \", player_input: str = \"\", action: str = \"\") -> dict:\n    try:\n \
          \       payload = json.loads(state_json or \"{}\")\n    except Exception:\n\
          \        payload = {}\n    state = payload.get(\"state\") or {}\n    memories\
          \ = payload.get(\"memories\") or []\n    recall_mode = payload.get(\"recall_mode\"\
          ) or \"\"\n    found = bool(payload.get(\"found\"))\n\n    lines = []\n\
          \    if str(action or \"\").strip().lower() == \"reset\":\n        lines.append(\"\
          【本轮操作】重置记忆（注销会员卡）\")\n    else:\n        lines.append(\"【本轮操作】正常对话\")\n\
          \    lines.append(\"【玩家会员卡号】\" + str(player_id))\n    lines.append(\"【玩家这一轮说】\"\
          \ + (str(player_input) if str(player_input).strip() else \"（他只是推门进来，没说话）\"\
          ))\n\n    if not found:\n        lines.append(\"【阿澈对这位客人的记忆】空——这是他第一次来这家店，你还不认识他。\"\
          )\n    else:\n        lines.append(\"【阿澈对这位客人的记忆】（来自 seekdb）\")\n      \
          \  lines.append(\"- 到店次数：\" + str(state.get(\"visit_count\")))\n       \
          \ lines.append(\"- 羁绊值：\" + str(state.get(\"bond_score\")))\n        lines.append(\"\
          - 当前章节：\" + str(state.get(\"chapter\")))\n        lines.append(\"- 常点：\"\
          \ + (str(state.get(\"favourite\")) if state.get(\"favourite\") else \"（还没常点过什么）\"\
          ))\n        lines.append(\"- 专属梗：\" + (str(state.get(\"running_joke\"))\
          \ if state.get(\"running_joke\") else \"（还没有）\"))\n        lines.append(\"\
          - 上次他说：\" + (str(state.get(\"last_input\")) if state.get(\"last_input\"\
          ) else \"（没有）\"))\n        lines.append(\"- 上次你回他：\" + (str(state.get(\"\
          last_reply\")) if state.get(\"last_reply\") else \"（没有）\"))\n        lines.append(\"\
          - 上次到店时间：\" + str(state.get(\"last_seen_at\")))\n\n    if memories:\n  \
          \      lines.append(\"【从历史对话里召回的往事】（seekdb 中文全文检索，召回方式：\" + str(recall_mode)\
          \ + \"）\")\n        for index, memory in enumerate(memories, 1):\n     \
          \       lines.append(\n                str(index) + \". [第\" + str(memory.get(\"\
          turn_no\")) + \"回合·\" + str(memory.get(\"chapter\") or \"\")\n         \
          \       + \"] 玩家：\" + str(memory.get(\"player_input\") or \"\")\n      \
          \          + \" ／ 阿澈：\" + str(memory.get(\"npc_reply\") or \"\")\n     \
          \       )\n    else:\n        lines.append(\"【从历史对话里召回的往事】没有召回到任何往事。\")\n\
          \n    lines.append(\"\")\n    lines.append(\"请以阿澈的身份回应。记忆为空就当第一次见面；记忆里有往事时，必须明确用上其中至少一条具体细节。\"\
          )\n    return {\"context\": \"\\n\".join(lines)}\n"
        code_language: python3
